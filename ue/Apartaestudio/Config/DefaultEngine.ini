[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Apto/Mapa_Apto.Mapa_Apto
GameDefaultMap=/Game/Apto/Mapa_Apto.Mapa_Apto

[/Script/Engine.RendererSettings]
; Lumen GI + reflections on hardware ray tracing (RTX 5060 Ti), virtual shadow maps, no baked lighting
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=2
r.Shadow.Virtual.Enable=1
r.AllowStaticLighting=False
r.SkinCache.CompileShaders=True
r.GenerateMeshDistanceFields=True
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=True
r.AntiAliasingMethod=4
; local fog volumes are culled near the camera by default; the unit is ~7 m deep, so draw them up close (see Simba's write-up)
r.LocalFogVolume.GlobalStartDistance=0
; offline-quality renders through Movie Render Queue's path tracer pass
r.PathTracing=True
r.LocalFogVolume.RenderIntoVolumetricFog=1

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; ray tracing (hardware Lumen, path tracer) needs Shader Model 6
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
