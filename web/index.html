<meta charset="utf-8">
<title>Apartaestudio con balcón</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* Layout: full-bleed 3D canvas; a title card top-left and a dock of room stops at the bottom, both floating over it. */
  :root {
    --bg: #eef0ec;            /* porcelain floor, cool */
    --panel: rgba(250, 249, 245, 0.88);
    --fg: #1f2523;
    --muted: #5d6763;
    --accent: #e2a90f;        /* the kitchen's mustard gloss */
    --accent-fg: #231a00;
    --sea: #1f5e6e;
    --line: rgba(31, 37, 35, 0.12);
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a19; --panel: rgba(22, 28, 27, 0.86); --fg: #eef1ee; --muted: #a3aeaa;
      --accent: #f0bb2a; --accent-fg: #231a00; --sea: #7cc3d1; --line: rgba(238, 241, 238, 0.14);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141a19; --panel: rgba(22, 28, 27, 0.86); --fg: #eef1ee; --muted: #a3aeaa;
    --accent: #f0bb2a; --accent-fg: #231a00; --sea: #7cc3d1; --line: rgba(238, 241, 238, 0.14);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .card {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: max(16px, env(safe-area-inset-left, 0px));
    max-width: min(360px, calc(100% - 32px));
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    display: grid; gap: 6px;
  }
  .card h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.35rem; line-height: 1.1; text-wrap: balance; letter-spacing: -0.01em; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .facts b { color: var(--fg); font-weight: 600; }
  .hint { font-size: 0.78rem; color: var(--muted); margin: 0; }
  .hint kbd { font-family: var(--body); font-size: 0.72rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

  .dock {
    position: fixed; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: center; pointer-events: none;
  }
  .stops {
    pointer-events: auto; display: flex; gap: 4px; padding: 5px;
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 999px; max-width: 100%; overflow-x: auto; scrollbar-width: none;
  }
  .stops button {
    font: 600 0.88rem/1 var(--body); color: var(--fg); background: transparent; border: 0;
    padding: 10px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .stops button:hover { background: var(--line); }
  .stops button:focus-visible { outline: 2px solid var(--sea); outline-offset: 1px; }
  .stops button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

  .status {
    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
    font: 500 0.95rem var(--body); color: var(--muted);
  }
  .status[hidden] { display: none; }
  .status .bar { width: 180px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 10px; }
  .status .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
  @media (max-width: 520px) {
    .card { padding: 12px 14px; }
    .card h1 { font-size: 1.15rem; }
    .hint .desk { display: none; }
  }
  @media (hover: none) { .hint .desk { display: none; } }
</style>

<canvas id="scene" tabindex="0" aria-label="Vista 3D del apartaestudio"></canvas>

<section class="card">
  <h1>Apartaestudio con balcón</h1>
  <div class="facts"><span><b>34 m²</b> + balcón 1,09 × 4,70 m</span><span>Cama doble · sofá cama</span><span>Apartaestudio con balcón</span></div>
  <p class="hint">Arrastra para mirar alrededor<span class="desk"> · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> para caminar</span>. Medidas del plano arquitectónico.</p>
</section>

<div class="status" id="status"><div><span id="statusText">Cargando el apartamento…</span><div class="bar"><i id="bar"></i></div></div></div>

<nav class="dock" aria-label="Ambientes">
  <div class="stops" id="stops"></div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  // apartaestudio plan: unit 4.05 x 6.80 m, floor at +3.0 m, bed head on the right wall
  const Z0 = 3.0;
  // Blender coordinates (x right, y toward the balcony, z up) -> glTF/three (x, z, -y)
  const V = (x, y, z) => new THREE.Vector3(x, z, -y);
  const STOPS = [
    { id: 'entrada',  label: 'Entrada',    eye: V(1.25, 0.35, Z0 + 1.6), look: V(1.6, 6.8, Z0 + 1.1) },
    { id: 'cocina',   label: 'Cocina',     eye: V(1.6, 0.95, Z0 + 1.55), look: V(0.0, 1.55, Z0 + 1.2) },
    { id: 'cama',     label: 'Habitación', eye: V(0.8, 4.9, Z0 + 1.55),  look: V(4.05, 5.15, Z0 + 0.9) },
    { id: 'bano',     label: 'Baño',       eye: V(3.2, 2.95, Z0 + 1.5),  look: V(3.7, 0.6, Z0 + 0.8) },
    { id: 'balcon',   label: 'Balcón',     eye: V(3.3, 7.5, Z0 + 1.6),   look: V(5.0, 20.0, Z0 - 1.5) },
    { id: 'planta',   label: 'Planta',     eye: V(2.0, -3.0, Z0 + 10),   look: V(2.0, 4.0, Z0), plan: true },
  ];
  const HIDE_IN_PLAN = ['Ceiling', 'Slabs', 'Block', 'Roller_Blind', 'AC_Split', 'Downlights', 'Fridge_Cabinet', 'Kitchen_Uppers', 'Closet'];

  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.physicallyCorrectLights = true;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbcd7e6);
  scene.fog = new THREE.Fog(0xbcd7e6, 60, 260);
  // golden-hour sun off the sea (same direction as the Blender film) + soft sky and warm ceiling fills
  scene.add(new THREE.HemisphereLight(0xf2f5ff, 0xc9b79a, 1.6));
  const sun = new THREE.DirectionalLight(0xffc98a, 3.2);
  sun.position.copy(V(2.0 - 0.30 * 40, 4.0 + 0.93 * 40, Z0 + 0.24 * 40));
  sun.target.position.copy(V(2.0, 4.0, Z0)); scene.add(sun, sun.target);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004;
  Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 90 });
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  [[1.2, 3.6], [2.8, 3.6], [1.2, 5.8], [2.8, 5.8], [1.2, 1.2], [3.4, 1.8]].forEach(([x, y]) => {
    const l = new THREE.PointLight(0xffe2bd, 1.6, 4, 2); l.position.copy(V(x, y, Z0 + 2.35)); scene.add(l);
  });
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(4000, 3000), new THREE.MeshStandardMaterial({ color: 0x2b6f80, roughness: 0.25 }));
  sea.rotation.x = -Math.PI / 2; sea.position.copy(V(0, 1560, -0.1)); scene.add(sea);

  const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 2000);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = 0.12;

  let mode = 'walk', model = null;
  const hidden = [];

  function setStop(stop, animate) {
    document.querySelectorAll('.stops button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === stop.id)));
    const plan = !!stop.plan;
    hidden.forEach(o => { o.visible = !plan; });
    mode = plan ? 'plan' : 'walk';
    controls.enableZoom = plan; controls.enablePan = plan;
    controls.rotateSpeed = plan ? 0.6 : -0.35;
    controls.minPolarAngle = plan ? 0.05 : 0.25; controls.maxPolarAngle = plan ? 1.3 : Math.PI - 0.25;
    const dir = stop.look.clone().sub(stop.eye).normalize();
    const target = plan ? stop.look.clone() : stop.eye.clone().add(dir.multiplyScalar(0.05));
    const fromEye = camera.position.clone(), fromTgt = controls.target.clone();
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!animate || reduce) { camera.position.copy(stop.eye); controls.target.copy(target); controls.update(); return; }
    const t0 = performance.now(), dur = 900;
    (function step(now) {
      const k = Math.min(1, (now - t0) / dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      camera.position.lerpVectors(fromEye, stop.eye, e); controls.target.lerpVectors(fromTgt, target, e);
      controls.update(); if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  const stopsEl = document.getElementById('stops');
  STOPS.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'stop-' + s.id; b.dataset.id = s.id; b.textContent = s.label; b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => { setStop(s, true); try { localStorage.setItem('apto-stop', s.id); } catch (e) {} });
    stopsEl.appendChild(b);
  });

  // walking: WASD / arrows move eye and target together on the floor plane
  const keys = {};
  window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  function walk(dt) {
    if (mode !== 'walk') return;
    const f = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0);
    const r = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
    if (!f && !r) return;
    const fwd = controls.target.clone().sub(camera.position); fwd.y = 0; fwd.normalize();
    const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
    const move = fwd.multiplyScalar(f).add(right.multiplyScalar(r)).multiplyScalar(1.4 * dt);
    camera.position.add(move); controls.target.add(move);
  }

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w < h ? 85 : 70; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  const statusEl = document.getElementById('status'), bar = document.getElementById('bar');
  // The published page refuses data: URIs, so the base64 buffer embedded in the glTF is decoded here and the model is
  // handed to the loader as an in-memory GLB; its textures still load as files from m/.
  async function fetchGlb(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + url);
    const total = +res.headers.get('content-length') || 0, reader = res.body.getReader(), parts = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value); got += value.length;
      if (total) bar.style.width = Math.round(90 * got / total) + '%';
    }
    const g = JSON.parse(await new Blob(parts).text());
    const b64 = g.buffers[0].uri.slice(g.buffers[0].uri.indexOf(',') + 1);
    const raw = atob(b64), bin = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bin[i] = raw.charCodeAt(i);
    delete g.buffers[0].uri; g.buffers[0].byteLength = bin.length;
    const pad4 = n => (n + 3) & ~3;
    const js = new TextEncoder().encode(JSON.stringify(g));
    const jsLen = pad4(js.length), binLen = pad4(bin.length);
    const out = new ArrayBuffer(12 + 8 + jsLen + 8 + binLen), dv = new DataView(out), u8 = new Uint8Array(out);
    dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, out.byteLength, true);
    dv.setUint32(12, jsLen, true); dv.setUint32(16, 0x4E4F534A, true);
    u8.fill(0x20, 20, 20 + jsLen); u8.set(js, 20);
    dv.setUint32(20 + jsLen, binLen, true); dv.setUint32(24 + jsLen, 0x004E4942, true);
    u8.set(bin, 28 + jsLen);
    bar.style.width = '95%';
    return out;
  }
  fetchGlb('m/apartaestudio.gltf.json').then(glb => new THREE.GLTFLoader().parse(glb, 'm/', gltf => {
    model = gltf.scene;
    model.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = o.receiveShadow = true;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => {
        const n = (m.name || '').toLowerCase();
        if (n.includes('glass') || n.includes('vidrio') || m.transmission > 0) {
          o.castShadow = false;
          m.transparent = true; m.opacity = n.includes('frost') ? 0.6 : 0.12; m.transmission = 0; m.depthWrite = false; m.roughness = 0.05;
        }
      });
      if (HIDE_IN_PLAN.some(p => o.name.startsWith(p) || (o.parent && o.parent.name.startsWith(p)))) hidden.push(o);
    });
    scene.add(model);
    statusEl.remove();
    let first = STOPS[0];
    try { const saved = localStorage.getItem('apto-stop'); first = STOPS.find(s => s.id === saved) || first; } catch (e) {}
    const fromHash = STOPS.find(s => '#' + s.id === location.hash);
    setStop(fromHash || first, false);
  }, onFail)).catch(onFail);
  function onFail(err) {
    document.getElementById('statusText').textContent = 'No se pudo cargar el modelo 3D (' + (err && (err.message || err)) + '). Recarga la página para intentarlo de nuevo.';
    console.error(err);
  }
  setStop(STOPS[0], false);

  let last = performance.now();
  renderer.setAnimationLoop(now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    walk(dt); controls.update(); renderer.render(scene, camera);
  });
})();
</script>
